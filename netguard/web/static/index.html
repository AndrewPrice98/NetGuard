<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetGuard</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview" aria-label="NetGuard overview">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.9 8 10 4.6-1.1 8-5 8-10v-6l-8-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        NetGuard
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/overview" data-page="overview">Overview</a>
        <a href="#/incidents" data-page="incidents">Incidents <span class="nav-n" id="nav-incidents"></span></a>
        <a href="#/alerts" data-page="alerts">Alerts <span class="nav-n" id="nav-alerts"></span></a>
        <a href="#/devices" data-page="devices">Devices <span class="nav-n" id="nav-devices"></span></a>
        <a href="#/activity" data-page="activity">Activity</a>
        <a href="#/detections" data-page="detections">Detections</a>
        <a href="#/rules" data-page="rules">Rules</a>
      </nav>
      <div class="monitor" id="monitor">
        <span class="mon-state" id="status-pill">Connecting</span>
        <span class="mon-facts" id="monitor-facts"></span>
        <button class="btn" id="scan-btn" type="button">Scan now</button>
        <button class="btn danger" id="stop-btn" type="button" title="Shut down this NetGuard server">Stop</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="banner" id="banner" role="alert" hidden></div>
    <div id="page"></div>
  </main>
  <footer class="foot" id="foot"></footer>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" tabindex="-1">
    <div class="drawer-inner" id="drawer-body"></div>
  </aside>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
